<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color:beige">

    <div class="container-fluid">
        <div class="row align-items-center py-3 px-3">
            <div class="col text-end">
                <button class="me-2 fw-semibold btn btn-secondary">Welcome, <span style="color:lime">{{ username
                        }}</span></button>
                <a href="/history/{{ username }}" class="me-2 fw-semibold btn btn-primary">History</a>
                <a href="/logout" class="fw-semibold btn btn-danger">Logout</a>
            </div>
        </div>
    </div>

    <div class="container d-flex justify-content-center align-items-center" style="min-height:80vh">
        <div class="card shadow-lg p-4 rounded-4"
            style="width:100%;max-width:600px;min-height:220px;background-color:#fff7e6">
            <h4 class="text-center mb-4">URL Shortener</h4>

            <form method="POST">
                <div class="mb-3">
                    <input type="url" name="original_url" class="form-control" placeholder="Enter URL to shorten"
                        required>
                </div>

                <div class="d-grid mb-4">
                    <button class="btn btn-success">Shorten URL</button>
                </div>
            </form>

            <div class="input-group">
                <input type="text" id="shortUrl" class="form-control" value="{{ short_url if short_url else '' }}"
                    placeholder="Shortened URL will appear here" readonly disabled>
                <button id="copyBtn" class="btn btn-success" {% if not short_url %}disabled{% endif %}
                    onclick="copyurl()">
                    Copy
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function copyurl() {
            const ip = document.getElementById('shortUrl')
            const btn = document.getElementById('copyBtn')
            navigator.clipboard.writeText(ip.value)

            btn.innerText = 'Copied!'
            btn.classList.remove('btn-success')
            btn.classList.add('btn-secondary')
            setTimeout(() => {
                btn.innerText = 'Copy'
                btn.classList.remove('btn-secondary')
                btn.classList.add('btn-success')
            }, 1500)
        }
    </script>
</body>

</html>
