<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: beige;
        }

        .card {
            background: beige;
            border-radius: 1rem;
        }

        table th,
        table td {
            vertical-align: middle;
        }
    </style>
</head>

<body>
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-semibold">Your URL History</h3>
            <a href="/dashboard/{{ username }}" class="btn btn-secondary">Back to Dashboard</a>
        </div>

        <div class="card shadow-lg p-4">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle">
                    <thead class="table-light">
                        <tr>
                            <th class="text-center">#</th>
                            <th>Original URL</th>
                            <th>Shortened URL</th>
                            <th class="text-center">Timestamp</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for url in urls %}
                        <tr>
                            <td class="text-center">{{ loop.index }}</td>
                            <td class="text-break">{{ url.original_url }}</td>
                            <td class="text-break">
                                <a href="{{ url.shortened_url }}" target="_blank">{{ url.shortened_url }}</a>
                            </td>
                            <td class="text-center">
                                {{ url.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}
                            </td>
                        </tr>
                        {% endfor %} {% if urls|length == 0 %}
                        <tr>
                            <td colspan="4" class="text-center py-4 text-muted">
                                No history available
                            </td>
                        </tr>
                        {% endif %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
